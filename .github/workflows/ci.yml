name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant, so
# stop it rather than paying for both. Never cancel on main: those runs are the
# record of what was published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Pinned to the same version as .nvmrc, package.json engines and
      # netlify.toml. The real floor is undici@8.10.1, pulled in transitively by
      # unifont, which needs 22.19.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Types first. It is the fastest check and the one most likely to fail, so
      # failing here saves installing a browser.
      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      # Chromium only, matching playwright.config.ts. --with-deps pulls the
      # system libraries the browser needs on a bare runner.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the site and serves it on 4323 itself, and
      # under CI it never reuses an existing server, so there is nothing to start
      # here. CI also turns on retries and forbids .only.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
